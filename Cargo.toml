[package]
edition = "2021"
name = "permutation-generator"
version = "0.1.2"

authors = ["Thomas Villa <thomvil87@gmail.com>"]
description = "A direct permutation generator"
documentation = "https://docs.rs/permutation-generator/"
homepage = "https://github.com/thomvil/permutation-generator-rs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thomvil/permutation-generator-rs"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "allow" }
cargo       = { level = "allow" }

missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[dependencies]
bit-index = ">=0.2"

[profile.release]
opt-level        = 3
debug            = "none"
strip            = "symbols"
debug-assertions = false
overflow-checks  = false
lto              = "fat"
panic            = "abort"
codegen-units    = 1
rpath            = false
incremental      = false
